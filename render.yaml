services:
  - type: web
    name: stomapp-miniapp-1
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_SECRET_CODE
        value: endurance
    healthCheckPath: /
    disk:
      name: stomapp-db
      mountPath: /app/backend/data
      sizeGB: 1
